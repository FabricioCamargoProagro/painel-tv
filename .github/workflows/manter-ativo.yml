# O GitHub desliga rotinas agendadas de repositório público depois de 60 dias sem atividade.
# Este fluxo grava uma linha por semana em estado/ativo.txt para a rotina do painel não parar sozinha.
# Não precisa de segredo nem de ação manual.
name: manter-ativo

on:
  schedule:
    - cron: "17 11 * * 1"          # toda segunda, 8h17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pulsar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Registrar atividade
        run: |
          mkdir -p estado
          date -u +"%Y-%m-%dT%H:%M:%SZ" > estado/ativo.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/ativo.txt
          git commit -m "manter a rotina agendada ativa" || exit 0
          git push
