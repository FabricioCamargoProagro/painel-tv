# Rotina do painel da TV do escritório (provisória, até o backend do app ter a rota /tv/).
# A cada 30 min, das 7h às 20h de Brasília, de segunda a sábado: entra no app de subscrição, pega a
# versão mais recente da planilha de Gestão de Propostas, gera os agregados, cifra e publica no Pages.
# A planilha (com dado pessoal) só existe dentro do runner e é apagada no fim; o que vai para o Pages
# é a página + dados.enc.json (cifrado) + estado.json (sem dado de negócio).
# Para rodar na hora: Actions → painel-tv → Run workflow.
name: painel-tv

on:
  schedule:
    # em UTC; = 7h–20h50 em Brasília (UTC−3), seg a sáb, de 10 em 10 min. O GitHub pula boa parte dos horários
    # agendados (em 10–12/11 rodou 4 de ~50); mais tentativas compensam. Minutos fora do :00, que é o mais disputado.
    - cron: "3,13,23,33,43,53 10-23 * * 1-6"
  workflow_dispatch: {}            # botão "Run workflow" para rodar na hora
  push:                            # mudança no painel/rotina publica na hora, sem esperar o horário
    branches: [main]
    paths:
      - "painel/**"
      - "coletor/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/painel-tv.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: painel-tv
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # se a coleta falhar, a TV continua com os últimos dados bons (e avisa "rotina com erro")
      - name: Guardar os últimos dados publicados
        run: |
          mkdir -p site
          curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/dados.enc.json" \
            -o site/dados.enc.json || rm -f site/dados.enc.json

      - name: Coletar, gerar e cifrar
        id: coletar
        continue-on-error: true
        env:
          SUBSCRICAO_URL: ${{ secrets.SUBSCRICAO_URL }}
          SUBSCRICAO_EMAIL: ${{ secrets.SUBSCRICAO_EMAIL }}
          SUBSCRICAO_SENHA: ${{ secrets.SUBSCRICAO_SENHA }}
          TV_CHAVE: ${{ secrets.TV_CHAVE }}
          TV_METAS: ${{ secrets.TV_METAS }}
        run: python coletor/rodar.py --saida site --pagina painel

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # o Pages às vezes responde "No artifacts named github-pages were found… re-run later" (falha passageira
      # do GitHub, vista em 12/11): espera e tenta de novo uma vez antes de desistir
      - name: Esperar antes de tentar publicar de novo
        if: steps.publicar.outcome == 'failure'
        run: sleep 45

      - id: publicar2
        if: steps.publicar.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Marcar a execução como falha (a coleta falhou — ver o passo "Coletar, gerar e cifrar")
        if: steps.coletar.outcome == 'failure'
        run: exit 1
